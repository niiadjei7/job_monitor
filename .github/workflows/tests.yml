name: Tests

on:
  pull_request:
  push:
    branches: [main]
    paths-ignore:
      - state.json
      - job_search_tracker.csv
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repo
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      # The oracle test skips itself here: its data is private and gitignored.
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
