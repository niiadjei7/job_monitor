# Active job sources. Every source below uses a public endpoint and is enabled.
#
# A posting must match at least one specialty category AND an early-career title
# signal. Terms are literal, case-insensitive whole words or phrases. Generic
# standalone terms such as "engineer", "developer", and "software" are omitted.

keyword_sets:
  devops: &devops_keywords
    title:
      - "devops"
      - "site reliability"
      - "sre"
      - "platform engineer"
      - "cloud engineer"
      - "infrastructure engineer"
      - "systems engineer"
      - "release engineer"
      - "build engineer"
      - "cloud operations"
      - "automation engineer"
      - "ci/cd"
      - "kubernetes"
      - "terraform"
    context:
      - "devops"
      - "site reliability"
      - "platform"
      - "infrastructure"
      - "cloud operations"
      - "cloud engineering"

  aws_cloud: &aws_keywords
    title:
      - "aws"
      - "amazon web services"
      - "aws cloud"
    context:
      - "aws"
      - "amazon web services"
      - "aws cloud"

  data_analytics: &data_analytics_keywords
    title:
      - "data analyst"
      - "business intelligence"
      - "bi analyst"
      - "reporting analyst"
      - "analytics engineer"
    context:
      - "data analytics"
      - "business intelligence"
      - "analytics"

  data_science: &data_science_keywords
    title:
      - "data scientist"
      - "machine learning"
      - "ml engineer"
      - "applied scientist"
    context:
      - "data science"
      - "machine learning"
      - "applied science"

  architecture: &architecture_keywords
    title:
      - "solutions architect"
      - "solution architect"
      - "cloud architect"
      - "systems architect"
      - "technical architect"
    context:
      - "solutions architecture"
      - "cloud architecture"
      - "technical architecture"

  early_career: &early_career_keywords
    - "new grad"
    - "new graduate"
    - "early career"
    - "early careers"
    - "entry level"
    - "entry-level"
    - "junior"
    - "associate"
    - "software engineer i"
    - "developer i"
    - "devops engineer i"
    - "cloud engineer i"
    - "platform engineer i"
    - "infrastructure engineer i"
    - "systems engineer i"
    - "data analyst i"
    - "data scientist i"
    - "analytics engineer i"
    - "solutions architect i"

  seniority: &senior_title_keywords
    - "senior"
    - "sr"
    - "staff"
    - "principal"
    - "lead"
    - "manager"
    - "director"
    - "head"
    - "vice president"
    - "vp"
    - "engineer ii"
    - "engineer iii"
    - "developer ii"
    - "developer iii"
    - "analyst ii"
    - "analyst iii"
    - "scientist ii"
    - "scientist iii"
    - "architect ii"
    - "architect iii"

source_defaults:
  early_career_keywords: *early_career_keywords
  exclude_keywords: *senior_title_keywords

# Company ATS feeds do not consistently provide coordinates, so this is a
# strict NYC-metro location matcher rather than a geocoding dependency. Generic
# remote roles are accepted only when the feed explicitly identifies the U.S.
location_filters:
  ny_nj: &ny_nj_location
    include_remote: true
    remote_include:
      - "United States"
      - "USA"
      - "US"
    allow_unspecified_remote: false
    allow_unknown: false
    include:
      - "New York"
      - "New York, NY"
      - "New York, New York"
      - "New York City"
      - "NYC"
      - "Manhattan"
      - "Brooklyn"
      - "Queens"
      - "Bronx"
      - "Staten Island"
      - "Long Island City"
      - "White Plains"
      - "Yonkers"
      - "New Rochelle"
      - "Tarrytown"
      - "Rye"
      - "Port Chester"
      - "Purchase"
      - "Nanuet"
      - "Hempstead"
      - "Garden City"
      - "Bethpage"
      - "Hicksville"
      - "Melville"
      - "New Jersey"
      - "NJ"
      - "Jersey City"
      - "Newark"
      - "Hoboken"
      - "Secaucus"
      - "Weehawken"
      - "Hackensack"
      - "Fort Lee"
      - "Paramus"
      - "Morristown"
      - "Parsippany"
      - "Edison"
      - "New Brunswick"
      - "Princeton"

