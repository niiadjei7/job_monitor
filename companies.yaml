# Companies to monitor for new job postings.
#
# ats: one of "greenhouse", "lever", "ashby"
# slug: the company's identifier on that ATS platform. How to find it:
#
#   Greenhouse: career page URL is usually job-boards.greenhouse.io/<slug>
#               or boards.greenhouse.io/<slug>
#   Lever:      career page URL is usually jobs.lever.co/<slug>
#   Ashby:      career page URL is usually jobs.ashby.hq.com/<slug>
#               (sometimes a custom domain — check page source for
#               "ashbyhq.com/api/... /<slug>" if unsure)
#
# keywords: optional. If set, a posting only triggers a Discord ping when
#           its title contains at least one of these (case-insensitive).
#           Leave empty ([]) to get pinged on every new posting.

companies:
  - name: "Greenhouse"
    ats: greenhouse
    slug: "greenhouse"
    keywords: ["engineer", "developer", "software", "data", "platform", "IT"]

  - name: "Vercel"
    ats: greenhouse
    slug: "vercel"
    keywords: ["engineer", "developer", "software", "backend", "frontend", "platform"]

  - name: "PointClickCare"
    ats: lever
    slug: "pointclickcare"
    keywords: ["engineer", "developer", "software", "platform", "IT", "cloud"]

  - name: "FreedomPay"
    ats: lever
    slug: "freedompay"
    keywords: ["engineer", "developer", "software", "backend", "DevOps", "IT"]

  - name: "Ashby"
    ats: ashby
    slug: "ashby"
    keywords: ["engineer", "developer", "software", "platform", "IT", "systems"]

  - name: "Beacon Software"
    ats: ashby
    slug: "beaconsoftware"
    keywords: ["engineer", "developer", "software", "platform", "IT", "systems"]
