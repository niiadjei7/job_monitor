# Every source inherits these unless it sets its own.
source_defaults:
  early_career_keywords: *early_career_keywords
  exclude_keywords: *senior_title_keywords
  non_role_title_keywords: *non_role_title_keywords
  # Job relays and gig marketplaces seen on aggregators; they repost other
  # companies' roles or offer task work rather than employment.
  exclude_companies: ["Jobgether", "OpenTrain AI"]
  location_filter: *ny_nj_location
  keyword_categories:
    Software Engineering: *software_engineering_keywords
    DevOps: *devops_keywords
    AWS/Cloud: *aws_keywords
    Cybersecurity: *cybersecurity_keywords
    Data Analytics: *data_analytics_keywords
    Data Science: *data_science_keywords
    Architecture: *architecture_keywords

