# Company ATS feeds do not consistently provide coordinates, so this is a
# NYC-metro location matcher rather than a geocoding dependency. Explicitly
# located roles stay local, while bare remote roles are allowed through.
location_filters:
  ny_nj: &ny_nj_location
    include_remote: true
    remote_include:
      - "United States"
      - "USA"
      - "US"
    allow_unspecified_remote: true
    allow_unknown: false
    include:
      - "New York"
      - "New York, NY"
      - "New York, New York"
      - "New York City"
