# Jobvite, LinkedIn, and Indeed adapters stay inactive: they require approved
# private feed URLs. ZipRecruiter is not active because its public MCP endpoint
# is currently rate-limiting these scheduled requests.
# freehire.me aggregates ~50 ATS platforms and boards (including LinkedIn
# listings) behind a public JSON API with full descriptions. Results pass the
# same gates as company boards; duplicates of company-board postings are
# dropped by the cross-source company+title key.
freehire_queries: &freehire_queries
  - "title:software engineer OR title:software developer OR title:developer OR title:full stack OR title:backend"
  - "title:devops OR title:site reliability OR title:platform engineer OR title:cloud engineer OR title:infrastructure engineer"
  - "title:data analyst OR title:data scientist OR title:machine learning OR title:analytics engineer OR title:business intelligence"
  - "title:security engineer OR title:cybersecurity OR title:security analyst OR title:solutions architect OR title:forward deployed"

searches:
  - id: "freehire-nyc"
    name: "freehire (NYC area)"
    enabled: true
    ats: freehire
    aggregator: true
    quiet_first_run: true
    require_early_career: true
    queries: *freehire_queries
    cities: ["New York", "Brooklyn", "Jersey City", "Hoboken", "Newark", "Princeton", "Morristown", "White Plains"]
    posted_within_days: 2
    max_pages: 3

  - id: "freehire-us-remote"
    name: "freehire (US remote)"
    enabled: true
    ats: freehire
    aggregator: true
    quiet_first_run: true
    require_early_career: true
    queries: *freehire_queries
    countries: ["us"]
    work_mode: "remote"
    posted_within_days: 2
    max_pages: 3
