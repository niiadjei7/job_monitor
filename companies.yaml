# Active job sources. Every source below uses a public endpoint and is enabled.
#
# Keywords are case-insensitive whole words or phrases. Generic terms such as
# "IT" and "data" are intentionally omitted because they include many
# unrelated roles.

companies:
  - name: "Greenhouse"
    enabled: true
    ats: greenhouse
    slug: "greenhouse"
    keywords: &resume_keywords
      - "engineer"
      - "engineering"
      - "developer"
      - "software"
      - "junior"
      - "new grad"
      - "entry level"
      - "entry-level"
      - "web"
      - "full stack"
