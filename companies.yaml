# Active job sources. Every source below uses a public endpoint and is enabled.
#
# Keywords are case-insensitive whole words or phrases. Generic terms such as
# "IT" and "data" are intentionally omitted because they include many
# unrelated roles.

# Seniority is excluded independently from the positive role keywords, so a
# title such as "Senior Software Engineer" cannot match only because it contains
# "software" or "engineer".
keyword_filters:
  seniority: &senior_title_keywords
    - "senior"
    - "sr"
    - "staff"
    - "principal"
    - "lead"
    - "manager"
    - "director"
    - "head"
    - "vice president"
    - "vp"
    - "architect"
    - "engineer ii"
    - "engineer iii"
    - "developer ii"
    - "developer iii"

source_defaults:
  exclude_keywords: *senior_title_keywords

# Company ATS feeds do not consistently provide coordinates, so this is a
# strict NYC-metro location matcher rather than a geocoding dependency. Generic
# remote roles are accepted only when the feed explicitly identifies the U.S.
# ZipRecruiter uses its native numeric radius when it is enabled.
location_filters:
  ny_nj: &ny_nj_location
    include_remote: true
    remote_include:
      - "United States"
      - "USA"
      - "US"
    allow_unspecified_remote: false
    allow_unknown: false
    include:
      - "New York"
      - "New York, NY"
      - "New York, New York"
      - "New York City"
      - "NYC"
      - "Manhattan"
      - "Brooklyn"
      - "Queens"
      - "Bronx"
      - "Staten Island"
      - "Long Island City"
      - "White Plains"
      - "Yonkers"
      - "New Rochelle"
      - "Tarrytown"
      - "Rye"
      - "Port Chester"
      - "Purchase"
      - "Nanuet"
      - "Hempstead"
      - "Garden City"
      - "Bethpage"
      - "Hicksville"
      - "Melville"
      - "New Jersey"
      - "NJ"
      - "Jersey City"
      - "Newark"
      - "Hoboken"
      - "Secaucus"
      - "Weehawken"
      - "Hackensack"
      - "Fort Lee"
