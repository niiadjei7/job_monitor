# Job sources to monitor. Existing sources are enabled; templates for the new
# platforms are disabled until you replace their example identifiers.
#
# keywords are case-insensitive title filters. Use [] to notify for every job.

companies:
  - name: "Greenhouse"
    ats: greenhouse
    slug: "greenhouse"
    keywords: &engineering_keywords
      ["engineer", "developer", "software", "data", "platform", "IT"]

  - name: "Vercel"
    ats: greenhouse
    slug: "vercel"
    keywords: ["engineer", "developer", "software", "backend", "frontend", "platform"]

  - name: "PointClickCare"
    ats: lever
    slug: "pointclickcare"
    keywords: ["engineer", "developer", "software", "platform", "IT", "cloud"]

  - name: "FreedomPay"
    ats: lever
    slug: "freedompay"
    keywords: ["engineer", "developer", "software", "backend", "DevOps", "IT"]

  - name: "Ashby"
    ats: ashby
    slug: "ashby"
    keywords: ["junior", "fullstack", "devops", "software", "web", "entry". "newgrad"]

  - name: "Beacon Software"
    ats: ashby
    slug: "beaconsoftware"
    keywords: ["junior", "fullstack", "devops", "software", "web", "entry". "new grad"]
  # SmartRecruiters: careers.smartrecruiters.com/<slug>
  - name: "SmartRecruiters example"
    enabled: true
    ats: smartrecruiters
    slug: "smartrecruiters"
    keywords: ["junior", "fullstack", "devops", "software", "web", "entry". "new grad"]

  # Workable: apply.workable.com/<slug>
  - name: "Workable example"
    enabled: true
    ats: workable
    slug: "seeq"
    keywords:  ["junior", "fullstack", "devops", "software", "web", "entry". "new grad"]
    
  # Recruitee: <slug>.recruitee.com
  - name: "Recruitee example"
    enabled: true
    ats: recruitee
    slug: "faktionbv1"
    keywords: ["junior", "fullstack", "devops", "software", "web", "entry". "new grad"]

  # Workday URL shape:
  # https://<host>/<site>/... and /wday/cxs/<tenant>/<site>/jobs
  - name: "Workday example"
    enabled: true
    ats: workday
    host: "workday.wd5.myworkdayjobs.com"
    tenant: "workday"
    site: "Workday"
    keywords:  ["junior", "fullstack", "devops", "software", "web", "entry". "new grad"]

  # Jobvite supplies each customer with an XML/JSON job-feed URL. Store that
  # URL as a GitHub Actions secret rather than committing it when it has a key.
  - name: "Jobvite example"
    enabled: true
    ats: jobvite
    feed_url_env: "JOBVITE_FEED_URL"
    keywords:  ["junior", "fullstack", "devops", "software", "web", "entry". "new grad"]

searches:
  # ZipRecruiter's official MCP search endpoint does not require a secret.
  # Give every search a unique id so its seen-job state remains independent.
  - id: "ziprecruiter-software-philadelphia"
    name: "ZipRecruiter — software engineering near Philadelphia"
    enabled: true
    platform: ziprecruiter
    query: "software engineer"
    location: "Philadelphia, PA"
    radius: 25
    keywords:  ["junior", "fullstack", "devops", "software", "web", "entry". "new grad"]

  # LinkedIn and Indeed do not provide open job-seeker search APIs. These
  # adapters intentionally accept only an approved RSS/Atom/XML/JSON feed.
  # Add the URLs as repository secrets and enable the entries after approval.
  - id: "linkedin-approved-feed"
    name: "LinkedIn approved feed"
    enabled: true
    platform: linkedin
    feed_url_env: "LINKEDIN_FEED_URL"
    keywords:  ["junior", "fullstack", "devops", "software", "web", "entry". "new grad"]

  - id: "indeed-approved-feed"
    name: "Indeed approved feed"
    enabled: true
    platform: indeed
    feed_url_env: "INDEED_FEED_URL"
    keywords:  ["junior", "fullstack", "devops", "software", "web", "entry". "new grad"]
