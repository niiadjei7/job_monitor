# Active job sources. Every source below uses a public endpoint and is enabled.
#
# Keywords are case-insensitive whole words or phrases. Generic terms such as
# "IT" and "data" are intentionally omitted because they include many
# unrelated roles.

# Company ATS feeds do not consistently provide coordinates, so this is a
# strict NYC-metro location matcher rather than a geocoding dependency. Generic
# U.S.-remote roles are included; remote roles tied to another state/country are
# excluded. ZipRecruiter uses its native numeric radius when it is enabled.
location_filters:
  ny_nj: &ny_nj_location
    include_remote: true
    allow_unknown: false
    include:
      - "New York, NY"
      - "New York, New York"
      - "New York City"
      - "NYC"
      - "Manhattan"
      - "Brooklyn"
      - "Queens"
      - "Bronx"
      - "Staten Island"
      - "Long Island City"
      - "White Plains"
      - "Yonkers"
      - "New Rochelle"
      - "Tarrytown"
      - "Rye"
      - "Port Chester"
      - "Purchase"
      - "Nanuet"
      - "Hempstead"
      - "Garden City"
      - "Bethpage"
      - "Hicksville"
      - "Melville"
      - "New Jersey"
      - "NJ"
      - "Jersey City"
      - "Newark"
      - "Hoboken"
      - "Secaucus"
      - "Weehawken"
      - "Hackensack"
      - "Fort Lee"
      - "Paramus"
      - "Morristown"
      - "Parsippany"
      - "Edison"
      - "New Brunswick"
      - "Princeton"

