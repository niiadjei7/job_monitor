# Active job sources. Every source below uses a public endpoint and is enabled.
#
# A posting is notified only when its title (or team/department) matches a role
# category; description words alone never qualify a posting. Senior titles,
# non-role titles (general applications, talent communities) and postings that
# ask for more years than profile.preferences.max_years_experience are vetoed.
# Terms are literal, case-insensitive whole words or phrases. "engineer" and
# "software" alone are omitted as too generic; "developer" is a role title term,
# with developer-relations titles excluded under non_role.
# Run `python tests/oracle_eval.py eval` after changing any term here.

keyword_sets:
  devops: &devops_keywords
    title:
      - "devops"
      - "site reliability"
      - "sre"
      - "platform engineer"
      - "cloud engineer"
      - "infrastructure engineer"
      - "systems engineer"
      - "release engineer"
      - "build engineer"
      - "cloud operations"
      - "automation engineer"
      - "ci/cd"
      - "kubernetes"
      - "terraform"
    context:
      - "devops"
      - "site reliability"
      - "platform"
      - "infrastructure"
      - "cloud operations"
      - "cloud engineering"

  aws_cloud: &aws_keywords
    title:
